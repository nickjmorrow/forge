name: Forge
options:
  bundleIdPrefix: com.nicholai
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ForgeUI:
    path: ../UI
schemes:
  # Running from Xcode installs the optimized build: a Debug build of the app, ForgeCore and GRDB is about 3x slower on the phone.
  ForgeiOS:
    build:
      targets:
        ForgeiOS: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
targets:
  Forge:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: ForgeUI
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Forge
        # The sync hub is reached over Tailscale by plain HTTP (the tunnel is encrypted); App Transport Security would refuse that.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.forge
        PRODUCT_NAME: Forge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Forge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
  ForgeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Forge Rest Timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.forge.ios.widgets
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: ForgeWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Forge Rest Timer
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  ForgeiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: ForgeUI
      - target: ForgeWidgets
    entitlements:
      path: iOS/Forge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Forge reads your sleep, HRV and resting heart rate to show recovery next to your training."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Forge saves your finished workouts to Apple Health."
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.forge.ios
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Forge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Forge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_VERSION: "5.0"
